name: Build LogicB0B Questionario

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Lazarus
        uses: gcarreno/setup-lazarus@v1
        with:
          lazarus-version: "3.0"

      - name: Verificar Lazarus
        shell: powershell
        run: |
          $lazbuild = Get-Command lazbuild.exe -ErrorAction SilentlyContinue
          if (-not $lazbuild) {
            Write-Host "lazbuild.exe nao encontrado no PATH."
            exit 1
          }
          Write-Host "lazbuild encontrado em: $($lazbuild.Source)"
          lazbuild.exe --version

      - name: Compilar Questionario
        shell: cmd
        working-directory: projetos\LogicB0B
        run: |
          lazbuild Questionario.lpr

      - name: Verificar EXE
        shell: powershell
        working-directory: projetos/LogicB0B
        run: |
          if (-not (Test-Path "Questionario.exe")) {
            Write-Host "Questionario.exe nao foi gerado."
            exit 1
          }
          Get-Item "Questionario.exe"

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LogicB0B-Questionario
          path: projetos/LogicB0B/Questionario.exe
