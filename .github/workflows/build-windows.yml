name: Build LogicB0B Questionario
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Lazarus
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: "3.0"
          with-cache: false

      - name: Compilar Questionario
        shell: powershell
        working-directory: projetos/LogicB0B
        run: |
          $fpc = Get-Command fpc.exe -ErrorAction SilentlyContinue
          if (-not $fpc) {
            Write-Host "ERRO: fpc.exe nao encontrado no PATH."
            exit 1
          }
          Write-Host "fpc encontrado: $($fpc.Source)"

          $lazarusBase = "C:\lazarus"
          $lcl  = "$lazarusBase\lcl\units\x86_64-win64"
          $win  = "$lazarusBase\lcl\units\x86_64-win64\win32"
          $laz  = "$lazarusBase\components\lazutils\lib\x86_64-win64"

          Write-Host "Compilando Questionario.lpr para Windows x64..."
          fpc.exe -Twin64 -O2 `
            "-Fu$lcl" `
            "-Fu$win" `
            "-Fu$laz" `
            Questionario.lpr

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERRO: compilacao falhou."
            exit 1
          }
          Write-Host "Compilacao concluida."

      - name: Verificar EXE
        shell: powershell
        working-directory: projetos/LogicB0B
        run: |
          if (-not (Test-Path "Questionario.exe")) {
            Write-Host "ERRO: Questionario.exe nao foi gerado."
            Get-ChildItem
            exit 1
          }
          Write-Host "Questionario.exe gerado com sucesso."
          $tamanho = (Get-Item "Questionario.exe").Length
          Write-Host "Tamanho: $tamanho bytes"

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LogicB0B-Questionario
          path: projetos/LogicB0B/Questionario.exe
