name: Build LogicB0B Questionario

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Lazarus
        uses: gcarreno/setup-lazarus@v1
        with:
          lazarus-version: "3.0"

      - name: Localizar Lazarus
        shell: powershell
        run: |
          Get-ChildItem -Path "C:\lazarus" -Filter "lazbuild.exe" -Recurse | Select-Object -First 5 FullName

      - name: Compilar Questionario
        shell: powershell
        working-directory: projetos\LogicB0B
        run: |
          $lazbuild = Get-ChildItem -Path "C:\lazarus" -Filter "lazbuild.exe" -Recurse | Select-Object -First 1
          if (-not $lazbuild) {
            Write-Error "lazbuild.exe nao encontrado."
            exit 1
          }

          & $lazbuild.FullName Questionario.lpr

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LogicB0B-Questionario
          path: projetos/LogicB0B/Questionario.exe
