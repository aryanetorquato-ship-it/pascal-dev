name: Build LogicB0B Questionario

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Lazarus
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: "3.0"
          with-cache: false

      - name: Localizar Lazarus
        shell: powershell
        run: |
          $paths = @(
            "C:\lazarus",
            "C:\Program Files\Lazarus",
            "C:\Program Files (x86)\Lazarus"
          )

          $lazbuild = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $found = Get-ChildItem -Path $path -Filter "lazbuild.exe" -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $lazbuild = $found.FullName
                break
              }
            }
          }

          if (-not $lazbuild) {
            Write-Host "lazbuild.exe nao encontrado."
            exit 1
          }

          Write-Host "Lazbuild encontrado em: $lazbuild"
          "LAZBUILD=$lazbuild" >> $env:GITHUB_ENV

      - name: Compilar Questionario
        shell: powershell
        working-directory: projetos/LogicB0B
        run: |
          & "$env:LAZBUILD" Questionario.lpr

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LogicB0B-Questionario
          path: projetos/LogicB0B/Questionario.exe
