name: Build LogicB0B Questionario

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Lazarus
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: "3.0"
          with-cache: false

      - name: Localizar Lazarus
        shell: powershell
        run: |
          $lazbuild = Get-Command lazbuild.exe -ErrorAction SilentlyContinue

          if ($lazbuild) {
            Write-Host "lazbuild encontrado no PATH:"
            Write-Host $lazbuild.Source
            "LAZBUILD=$($lazbuild.Source)" >> $env:GITHUB_ENV
            exit 0
          }

          $candidatos = @(
            "C:\lazarus\lazbuild.exe",
            "C:\lazarus\lazbuild\lazbuild.exe",
            "C:\Program Files\Lazarus\lazbuild.exe",
            "C:\Program Files\Lazarus\lazbuild\lazbuild.exe",
            "C:\Program Files (x86)\Lazarus\lazbuild.exe",
            "C:\Program Files (x86)\Lazarus\lazbuild\lazbuild.exe"
          )

          foreach ($caminho in $candidatos) {
            if (Test-Path $caminho) {
              Write-Host "lazbuild encontrado:"
              Write-Host $caminho
              "LAZBUILD=$caminho" >> $env:GITHUB_ENV
              exit 0
            }
          }

          Write-Host "ERRO: lazbuild.exe nao foi encontrado."
          Write-Host "PATH atual:"
          Write-Host $env:PATH

          exit 1

      - name: Compilar Questionario
        shell: powershell
        working-directory: projetos/LogicB0B
        run: |
          Write-Host "Compilando Questionario para Windows x64..."
          fpc.exe -Twin64 -O2 Questionario.pas

          Write-Host "Compilando teste isolado do PowerShell..."
          fpc.exe -Twin64 -O2 TestePowerShell.pas

      - name: Verificar EXE
        shell: powershell
        working-directory: projetos/LogicB0B
        run: |
          if (-not (Test-Path "Questionario.exe")) {
            Write-Host "ERRO: Questionario.exe nao foi gerado."
            Get-ChildItem
            exit 1
          }

          if (-not (Test-Path "TestePowerShell.exe")) {
            Write-Host "ERRO: TestePowerShell.exe nao foi gerado."
            Get-ChildItem
            exit 1
          }

          Write-Host "Questionario.exe gerado com sucesso."
          Write-Host "TestePowerShell.exe gerado com sucesso."

      - name: Executar teste PowerShell
        shell: powershell
        working-directory: projetos/LogicB0B
        run: |
          Write-Host "Executando teste isolado..."
          .\TestePowerShell.exe

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LogicB0B-Questionario
          path: |
            projetos/LogicB0B/Questionario.exe
            projetos/LogicB0B/TestePowerShell.exe
